server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5434/fincore
spring.datasource.username=fincore
spring.datasource.password=fincore

# As tabelas são recriadas a cada subida e preenchidas pelo data.sql.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Cadastros: o Jackson lê e grava os atributos privados (sem setters) e ignora campos extras.
spring.jackson.visibility.field=any
spring.jackson.deserialization.fail-on-unknown-properties=false
